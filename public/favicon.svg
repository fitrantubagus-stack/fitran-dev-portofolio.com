<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container for Desktop Browser Favicon Tab -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF" />
  
  <!-- Overlapping 3-Bubble Logo Mark -->
  <g transform="translate(4, 2)">
    <!-- Yellow Circle (Top-Left) -->
    <circle cx="34" cy="18" r="11" fill="#FFD53D" opacity="0.9" />
    
    <!-- Cyan/Teal Circle (Top-Right) -->
    <circle cx="46" cy="16" r="11" fill="#00C5D6" opacity="0.9" />
    
    <!-- Coral/Orange Circle (Bottom-Right) -->
    <circle cx="44" cy="28" r="11" fill="#FF6F43" opacity="0.9" />
  </g>

  <!-- Stylized Bold 'F' Lettermark in Signature Brand Coral -->
  <path
    d="M 12 18 C 12 15.79 13.79 14 16 14 L 32 14 C 34.21 14 36 15.79 36 18 C 36 20.21 34.21 22 32 22 L 20 22 L 20 28 L 29 28 C 31.21 28 33 29.79 33 32 C 33 34.21 31.21 36 29 36 L 20 36 L 20 48 C 20 50.21 18.21 52 16 52 C 13.79 52 12 50.21 12 48 Z"
    fill="#FF6F43"
  />

  <!-- Subtle Micro Details 'DEV' Underneath -->
  <text x="13" y="59" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" letter-spacing="1.2" fill="#18181B">DEVELOPER</text>
</svg>
